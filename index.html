<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f5f7fa; color: #333; line-height: 1.6; }
        
        /* 布局容器 */
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        
        /* 头部样式 */
        .header { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .logo { width: 100px; height: 100px; background: #ff7e5f; border-radius: 22px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: bold; }
        h1 { font-size: 28px; color: #2c3e50; margin-bottom: 10px; }
        .subtitle { color: #7f8c8d; font-size: 16px; margin-bottom: 30px; }
        
        /* 下载按钮 */
        .btn-download { display: inline-block; background: #007aff; color: #fff; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-size: 18px; font-weight: 600; transition: background 0.3s; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
        .btn-download:hover { background: #0056b3; }
        .app-note { font-size: 13px; color: #95a5a6; }

        /* 公司介绍卡片 */
        .card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: left; margin-bottom: 30px; }
        .card h2 { font-size: 20px; margin-bottom: 15px; color: #2c3e50; border-left: 4px solid #007aff; padding-left: 10px; }
        .card p { color: #555; font-size: 15px; margin-bottom: 10px; }

        /* 底部 */
        .footer { color: #95a5a6; font-size: 14px; margin-top: 40px; }
        .footer a { color: #007aff; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部区域 -->
        <div class="header">
            <!-- 这里的文字可以换成你的 App 图标图片，目前用文字代替 -->
            <div class="logo">AI</div>
